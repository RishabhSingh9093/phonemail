services:
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: phonemail
      POSTGRES_PASSWORD: phonemail_password
      POSTGRES_DB: phonemail
    ports:
      - "5432:5432"
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phonemail"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 5s
      timeout: 5s
      retries: 5

  mail-service:
    build: ./mail-service
    environment:
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    depends_on:
      mailpit:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "5001:5000"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://phonemail:phonemail_password@database:5432/phonemail
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - JWT_EXPIRES_IN=7d
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - OTP_MODE=${OTP_MODE:-development}
      - TEXTBEE_API_KEY=${TEXTBEE_API_KEY:-}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - MESSAGE_KEY=${MESSAGE_KEY:-}
    depends_on:
      database:
        condition: service_healthy
      mail-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:5001
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
